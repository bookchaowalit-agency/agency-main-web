version: '3'

tasks:
  default:
    desc: Show public agency website tasks
    cmds:
      - task --list

  dev:
    desc: Start the static-site development server
    cmds:
      - npm run dev

  test:
    desc: Test showcase generation and font packaging
    cmds:
      - npm run test

  typecheck:
    desc: Type-check the public agency website
    cmds:
      - npm run typecheck

  build:
    desc: Build the static website into out/
    cmds:
      - npm run build

  start:
    desc: Serve the production build through Next.js for local inspection
    cmds:
      - npm run start

  check:
    desc: Test, type-check and build the public agency website
    cmds:
      - task: test
      - task: typecheck
      - task: build
